name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_version=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Validate Wails version metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wails.json', 'utf8'));
          const expected = process.env.RELEASE_VERSION;
          const actual = config.version;
          const productVersion = config.info?.productVersion;

          if (actual !== expected) {
            throw new Error(`wails.json version ${actual} does not match release version ${expected}`);
          }
          if (productVersion !== expected) {
            throw new Error(`wails.json info.productVersion ${productVersion} does not match release version ${expected}`);
          }
          NODE

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: watools-windows-amd64
            wails_platform: windows/amd64
          - os: macos-14
            artifact_name: watools-macos-universal
            wails_platform: darwin/universal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        shell: bash
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "pnpm install failed after ${attempt} attempts" >&2
              exit 1
            fi

            echo "pnpm install failed on attempt ${attempt}, retrying..." >&2
            sleep $((attempt * 10))
          done

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: wails build -clean -platform "${{ matrix.wails_platform }}" -nsis

      - name: Package Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/bin/watools-amd64-installer.exe" "dist/watools_${{ needs.prepare.outputs.release_version }}_windows_amd64_installer.exe"

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: wails build -clean -platform "${{ matrix.wails_platform }}"

      - name: Package macOS release asset
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/bin/watools.app" "dist/watools_${{ needs.prepare.outputs.release_version }}_macos_universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release when needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$RELEASE_TAG" \
              --target "${GITHUB_SHA}" \
              --title "$RELEASE_TAG" \
              --generate-notes
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Upload platform assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          mapfile -t assets < <(find dist -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No build artifacts found" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Export release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: gh release view "$RELEASE_TAG" --json body,name,publishedAt,tagName,url > dist/release.json

      - name: Generate update manifest
        env:
          ARTIFACTS_DIR: dist
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          REPO_SLUG: ${{ github.repository }}
          RELEASE_METADATA_FILE: dist/release.json
        run: node scripts/generate-release-manifest.mjs

      - name: Upload update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/watools_latest.json dist/SHA256SUMS.txt --clobber
