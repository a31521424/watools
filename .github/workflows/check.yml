name: checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Verify macOS development entry
        if: runner.os == 'macOS'
        run: node --test scripts/dev-workflow.test.mjs
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: go test ./...
      - run: go test -race ./...
        if: runner.os == 'macOS'
      - run: go build -tags desktop,production ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -tags desktop,production ./...
      - run: pnpm audit --audit-level=high
        working-directory: frontend
      - run: go run ./cmd/pluginctl package --output dist-plugins
