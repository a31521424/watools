# Wails v3 watcher configuration. Project/release metadata remains in wails.json.
version: '3'
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, .cache, node_modules, frontend, build]
    file: [.DS_Store, .gitignore, .gitkeep, "*_test.go"]
    watched_extension: ["*.go"]
    git_ignore: true
  executes:
    - command: [node, scripts/dev.mjs, dev-build]
      type: blocking
      shutdown_timeout: 10s
    - command: [pnpm, --dir, frontend, dev]
      type: background
      readiness:
        http: "http://localhost:${WAILS_VITE_PORT}/"
        timeout: 60s
        interval: 200ms
      shutdown_timeout: 5s
    - command: [.cache/dev/bin/${WATOOLS_DEV_BINARY}/Contents/MacOS/watools]
      type: primary
      exit_policy: shutdown
      shutdown_timeout: 10s
